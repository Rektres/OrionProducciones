upstream frontend { server frontend:3000; }
upstream api_gateway { server express:3001; }

server {
    listen 80;
    server_name _;

    # robots.txt y sitemap.xml los genera Django (necesita los slugs publicados y
    # la URL publica real). Deben ir antes de "location /" para no caer en el SPA.
    location = /robots.txt {
        proxy_pass http://api_gateway/api/robots.txt;
        # $http_host (y no $host) para conservar el puerto: estas dos vistas generan
        # URLs absolutas a partir de la cabecera Host.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://api_gateway/api/sitemap.xml;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        client_max_body_size 10m;
        proxy_read_timeout 60s;
        proxy_pass http://api_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
