services:
  nginx:
    build: ./nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - express
    restart: unless-stopped
    networks:
      - orion_net

  frontend:
    build: ./frontend-vue
    expose:
      - 3000
    restart: unless-stopped
    networks:
      - orion_net

  express:
    build: ./bff-express
    expose:
      - 3001
    environment:
      DJANGO_API_URL: http://django:8000
      PORT: 3001
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    depends_on:
      django:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - orion_net

  django:
    build: ./backend-django
    expose:
      - 8000
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEBUG: ${DEBUG}
      DB_SSL_REQUIRE: ${DB_SSL_REQUIRE:-False}
      CORS_ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      ALLOWED_HOSTS: django,localhost,${SERVER_IP}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - orion_net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: orion
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - 5432
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - orion_net

volumes:
  postgres_data:
    driver: local

networks:
  orion_net:
    driver: bridge
