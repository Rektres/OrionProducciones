<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orion — Productora de Eventos en Chile</title>
    <meta name="description" content="Productora de eventos corporativos, sociales y festivales en Chile. Producción integral: escenario, sonido, iluminación y montaje. Cotiza tu evento con Orion." />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Twitter. Los crawlers de WhatsApp, Facebook y LinkedIn no ejecutan JS:
         estas etiquetas estáticas son las que ven al compartir cualquier URL del sitio.
         useSeo.ts las reescribe por página para el navegador y para Google.
         PENDIENTE: cuando exista dominio, poner og:image y twitter:image como URL
         absoluta (https://dominio/og-image.jpg) y agregar og:url. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Orion" />
    <meta property="og:locale" content="es_CL" />
    <meta property="og:title" content="Orion — Productora de Eventos en Chile" />
    <meta property="og:description" content="Productora de eventos corporativos, sociales y festivales en Chile. Producción integral: escenario, sonido, iluminación y montaje." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Orion — Productora de Eventos en Chile" />
    <meta name="twitter:description" content="Productora de eventos corporativos, sociales y festivales en Chile. Producción integral: escenario, sonido, iluminación y montaje." />
    <meta name="twitter:image" content="/og-image.jpg" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#03081c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
